/* ============================================================
   REFINAMIENTO VISUAL — misma paleta e identidad de Finanza,
   mejor jerarquía, ritmo y detalle. Solo CSS: no toca la lógica.
   ============================================================ */
:root{
  --r-xs:10px;--r-sm:14px;--r-md:18px;--r-lg:24px;--r-pill:999px;
  --sp-1:6px;--sp-2:10px;--sp-3:16px;--sp-4:22px;--sp-5:32px;
  --shadow-sm:0 4px 14px rgba(91,66,57,.06);
  --shadow-md:0 10px 28px rgba(91,66,57,.09);
  --shadow-lg:0 22px 55px rgba(91,66,57,.14);
  --ease:cubic-bezier(.22,.61,.36,1);
}
body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em}

/* Cards: más aire, borde más suave, elevación sutil al pasar el cursor */
.card{border-radius:var(--r-lg);box-shadow:var(--shadow-sm);transition:box-shadow .22s var(--ease),transform .22s var(--ease);border-color:rgba(234,222,218,.9)}
.card:hover{box-shadow:var(--shadow-md)}
.section-head h2{letter-spacing:-.01em}
.top h1{letter-spacing:-.025em}

/* Métricas: barra de acento + jerarquía tipográfica más marcada */
.metric{position:relative;overflow:hidden;padding-top:19px}
.metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--rose),var(--gold));border-radius:0 4px 4px 0}
.metric .label{letter-spacing:.03em}
.metric .value{letter-spacing:-.035em}
.savings-accent.metric::before{background:linear-gradient(180deg,var(--green),var(--rose))}

/* Botones: más tacto, sombra suave, ligera elevación al presionar */
.btn{border-radius:var(--r-sm);transition:transform .15s var(--ease),box-shadow .15s var(--ease),filter .15s var(--ease);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.rose{box-shadow:0 8px 20px rgba(219,168,161,.35)}
.btn.rose:hover{box-shadow:0 10px 24px rgba(219,168,161,.45)}
.btn.primary{box-shadow:0 8px 20px rgba(40,30,27,.22)}
.floating{transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.floating:hover{transform:translateY(-2px) scale(1.04)}
.btn:focus-visible,.field input:focus-visible,.field select:focus-visible,.nav button:focus-visible,.primary-bottom button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* Navegación: transición e indicador activo más elegante */
.nav button,.primary-bottom button{transition:background .18s var(--ease),color .18s var(--ease)}
.nav button.active{box-shadow:inset 0 0 0 1px rgba(219,168,161,.25)}
.primary-bottom button.active i{transform:translateY(-1px)}
.primary-bottom .bottom-add{transition:transform .18s var(--ease)}
.primary-bottom .bottom-add:active{transform:scale(.94)}

/* Filas y tablas: separación más clara, encabezado fijo, hover sutil */
.row{transition:background .15s var(--ease);border-radius:var(--r-xs)}
.row:hover{background:rgba(248,233,229,.45)}
.table thead th{position:sticky;top:0;background:var(--paper);z-index:1;letter-spacing:.02em}
.table tbody tr{transition:background .15s var(--ease)}
.table tbody tr:hover{background:rgba(248,233,229,.4)}
.table-wrap{border-radius:var(--r-md);border:1px solid var(--line)}
.table-wrap .table{border-collapse:separate;border-spacing:0}
.table-wrap .table th,.table-wrap .table td{border-bottom:1px solid var(--line)}
.table-wrap .table tr:last-child td{border-bottom:0}

/* Insignias, avisos y progreso: colores de marca, formas más suaves */
.badge{letter-spacing:.02em}
.notice,.success,.alert{border-radius:var(--r-sm);position:relative;padding-left:16px}
.progress{height:8px;background:#f1e7e4;border-radius:var(--r-pill);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:var(--r-pill);transition:width .3s var(--ease)}
.goal-progress i{background:linear-gradient(90deg,var(--rose),var(--gold))}

/* Metas de ahorro y tarjetas de deuda: más presencia visual */
.goal-card{border-radius:var(--r-md);transition:box-shadow .2s var(--ease)}
.goal-card:hover{box-shadow:var(--shadow-md)}
.debt-segments .debt-filter.card{border-radius:var(--r-md)}

/* Avatar e identidad: leve profundidad extra coherente con el monograma */
.avatar,.monogram{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}

/* Modal: entrada más suave */
.modal{border-radius:var(--r-lg);box-shadow:var(--shadow-lg)}
.modal-back.show .modal{animation:finanzaModalIn .22s var(--ease)}
@keyframes finanzaModalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* Login / bienvenida: mismo monograma y paleta, tipografía más cuidada */
.loginbox{border-radius:var(--r-lg);box-shadow:var(--shadow-lg)}
.tabs button{transition:background .18s var(--ease),color .18s var(--ease)}
.welcome-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;min-height:560px;padding:38px 0}
.welcome h1{font-size:52px;line-height:1.06;margin:14px 0;letter-spacing:-.03em}
.welcome-kicker{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#a56f67;background:var(--blush);padding:6px 12px;border-radius:var(--r-pill)}
.welcome-feature{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.welcome-feature:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.welcome-panel{transition:transform .2s var(--ease)}

/* Scrollbar discreta acorde a la marca (WebKit) */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rose2);border-radius:var(--r-pill)}
::-webkit-scrollbar-track{background:transparent}

  .welcome-hero{grid-template-columns:1fr;min-height:auto;padding:24px 0}
  .welcome h1{font-size:38px}
}

function loadDb(u){try{let x=JSON.parse(localStorage.getItem(keyDb(u)));return x?ensureSchema(x):null}catch{return null}}async function repo(action,payload,timeoutMs=7000){const c=new AbortController();const t=setTimeout(()=>c.abort(),timeoutMs);try{const r=await fetch('/api/user-repository?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({action,...payload}),signal:c.signal,cache:'no-store',credentials:'same-origin'});const text=await r.text();let data=null;try{data=JSON.parse(text)}catch{}if(!r.ok)throw new Error(data?.error||('HTTP '+r.status));return data}catch(e){window._lastRepoError=e?.message||'repository_unavailable';return null}finally{clearTimeout(t)}}
function accountBalance(a){if(a.type==='Tarjeta'){let used=Number(a.usedOpening)||0;for(const t of db.transactions){if(t.account!==a.id)continue;if(t.type==='Gasto'||t.type==='Compra con tarjeta')used+=convert(t.amount,t.currency,a.currency);if(t.type==='Pago de deuda')used-=convert(t.amount,t.currency,a.currency)}return Math.max(0,(Number(a.creditLimit)||0)-Math.max(0,used))}let b=Number(a.opening)||0;for(const t of db.transactions){if(t.type==='Ingreso'&&t.account===a.id&&t.affectsBalance!==false)b+=convert(t.amount,t.currency,a.currency);if((t.type==='Gasto'||t.type==='Pago de deuda'||t.type==='Ahorro'||t.type==='Inversión')&&t.account===a.id&&t.affectsBalance!==false)b-=convert(t.amount,t.currency,a.currency);if((t.type==='Retiro de ahorro'||t.type==='Retiro de inversión')&&t.account===a.id&&t.affectsBalance!==false)b+=convert(t.amount,t.currency,a.currency);if(t.type==='Transferencia'){if(t.from===a.id)b-=convert(t.amount,t.currency,a.currency);if(t.to===a.id)b+=convert(t.amount,t.currency,a.currency)}}return b}
function debtBalance(d){let b=Number(d.base)||0;for(const t of db.transactions){if(t.debt!==d.id)continue;if(t.type==='Pago de deuda')b-=convert(t.amount,t.currency,d.currency);if(t.type==='Compra con tarjeta'||t.type==='Gasto')b+=convert(t.amount,t.currency,d.currency)}return Math.max(0,b)}

function renderSpendTrendChart(cur){const c=$('finanzaSpendTrend');if(!c)return;const r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.max(280,r.width),h=Math.max(1,r.height);c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const base=new Date();base.setDate(1);let vals=[],labs=[];for(let i=5;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1),ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;let v=0;db.transactions.filter(t=>t.type==='Gasto'&&t.date?.startsWith(ym)).forEach(t=>v+=convert(t.amount,t.currency,cur));vals.push(v);labs.push(d.toLocaleDateString(db.language||'es',{month:'short'}).replace('.',''));}const max=Math.max(1,...vals);ctx.strokeStyle=finanzaThemeColor('--line','#eadeda');ctx.lineWidth=1;for(let i=0;i<4;i++){const y=25+i*(h-55)/3;ctx.beginPath();ctx.moveTo(34,y);ctx.lineTo(w-10,y);ctx.stroke()}const pts=vals.map((v,i)=>[42+i*(w-66)/5, h-34-(v/max)*(h-75)]);ctx.strokeStyle=finanzaThemeColor('--rose','#c77d73');ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();pts.forEach((p,i)=>{ctx.fillStyle=finanzaThemeColor('--rose','#c77d73');ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);ctx.fill();ctx.fillStyle=finanzaThemeColor('--muted','#7b6d68');ctx.font='10px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';ctx.textAlign='center';ctx.fillText(labs[i],p[0],h-12)});if(vals.every(v=>v===0)){ctx.fillStyle=finanzaThemeColor('--muted','#8a7e79');ctx.textAlign='center';ctx.font='12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';ctx.fillText('Aún no hay gastos registrados.',w/2,h/2)}}

function normalizeAnyeliTransactions(){if(String(user?.username||'').toLowerCase()!=='anyeli')return false;let changed=false;const fixes=[['2026-09-15','AUIP',3907.43,'EUR','Ingreso','BBVA','Beca'],['2026-09-15','NOMINA BHD',35193.94,'DOP','Ingreso','BHD Nómina','Nómina'],['2026-09-15','Alimentación',394.14,'DOP','Gasto','BHD Móvil','Alimentación'],['2026-09-15','GADIS - REFRIGERIO',448.65,'DOP','Gasto','BHD Móvil','Alimentación'],['2026-09-14','MERCADONA',21.63,'EUR','Gasto','BBVA','Alimentación'],['2026-09-14','CAFE',3.20,'EUR','Gasto','BBVA','Ocio']];for(const [date,desc,amount,currency,type,accountName,category] of fixes){let acc=db.accounts.find(a=>a.name===accountName);let matches=db.transactions.filter(t=>t.date===date&&t.type===type&&Number(t.amount)===amount&&t.currency===currency&&(t.account===acc?.id||!t.account));let tx=matches[0];if(!tx){tx={id:'seed-'+date+'-'+desc.toLowerCase().replace(/[^a-z0-9]+/g,'-'),date,type,amount,currency,description:desc,category,account:acc?.id||'',affectsBalance:true};db.transactions.push(tx);changed=true}else{if(tx.description!==desc||tx.category!==category||tx.account!==(acc?.id||tx.account)||tx.affectsBalance!==true)changed=true;tx.description=desc;tx.category=category;tx.account=acc?.id||tx.account;tx.affectsBalance=true}}return changed}

function ymDate(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function daysInMonth(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}function paymentEventsForMonth(ym){let [y,m]=ym.split('-').map(Number),out=[];for(const p of db.payments.filter(x=>x.active)){let start=p.dueDate||ymDate(y,m,1),sd=new Date(start+'T00:00:00Z');if(isNaN(sd))continue;let sm=sd.getUTCFullYear(),smo=sd.getUTCMonth()+1,sdn=sd.getUTCDate();if(p.frequency==='Único'){if(start.startsWith(ym))out.push({...p,eventDate:start});continue}if(new Date(`${ym}-01T00:00:00Z`)<new Date(`${sm}-${String(smo).padStart(2,'0')}-01T00:00:00Z`))continue;if(p.frequency==='Mensual'){out.push({...p,eventDate:ymDate(y,m,Math.min(sdn,daysInMonth(y,m)))});continue}if(p.frequency==='Anual'){if(m===smo)out.push({...p,eventDate:ymDate(y,m,Math.min(sdn,daysInMonth(y,m)))});continue}let step=p.frequency==='Quincenal'?14:7;let startMs=sd.getTime(),from=new Date(`${ym}-01T00:00:00Z`),to=new Date(`${ymDate(y,m,daysInMonth(y,m))}T23:59:59Z`);let first=startMs;while(first<from.getTime()){first+=step*86400000;if(first>to.getTime())break}for(let ms=first;ms<=to.getTime();ms+=step*86400000){let dt=new Date(ms),ds=ymDate(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());if(ds.startsWith(ym))out.push({...p,eventDate:ds})}}return out}function paymentCalendar(){let target=window.paymentsMonth||today().slice(0,7),[y,m]=target.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)),offset=(first.getUTCDay()+6)%7,total=daysInMonth(y,m),events=paymentEventsForMonth(target),cells=[];for(let i=0;i<offset;i++)cells.push('<div class="calendar-day empty"></div>');for(let d=1;d<=total;d++){let ds=ymDate(y,m,d),ev=events.filter(e=>e.eventDate===ds);cells.push(`<div class="calendar-day ${ds===today()?'today':''}"><div class="day-num">${d}</div>${ev.map(p=>{let st=paymentStatus({...p,dueDate:p.eventDate}),paid=db.transactions.some(t=>t.type==='Pago de deuda'&&t.paymentId===p.id&&t.date===p.eventDate);return .01" value="${i.annualRate||0}"></div><div class="field"><label>Tipo de tasa</label><select id="iv_rate_type"><option ${i.rateType==='Fija'?'selected':''}>Fija</option><option ${i.rateType==='Variable'?'selected':''}>Variable</option><option ${i.rateType==='Estimada'?'selected':''}>Estimada</option></select></div><div class="field"><label>Plazo (meses)</label><input id="iv_months" type="number" min="0" step="1" value="${i.termMonths||0}" placeholder="Ej. 12"></div><div class="field"><label>Fecha de inicio</label><input id="iv_start" type="date" value="${i.startDate||''}"></div><div class="field"><label>Fecha de vencimiento</label><input id="iv_end" type="date" value="${i.maturityDate||''}"></div><div class="field"><label>Plan relacionado</label><select id="iv_goal"><option value="">Sin plan</option>${goalOpts}</select></div><div class="field full"><label>Notas</label><input id="iv_note" value="${i.note||''}" placeholder="Ej. Renovación automática al vencimiento"></div></div><div class="notice">Finanza registra el capital, valor actual, tasa y plazo para que tengas tu cartera organizada. La rentabilidad mostrada es informativa y no constituye una recomendación de inversión.</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn rose" onclick="saveInvestment('${i.id}',${!!id})">Guardar</button></div>`)}
function saveInvestment(id,existing){let i=existing?db.investments.find(x=>x.id===id):{id};let name=$('iv_name').value.trim(),invested=Number($('iv_invested').value)||0,current=Number($('iv_current').value);if(!Number.isFinite(current)||current<0)current=invested;let accountId=$('iv_account').value,account=db.accounts.find(a=>a.id===accountId),currency=$('iv_cur').value;if(!name)return alert('Escribe el nombre del instrumento.');if(invested<=0)return alert('El capital invertido debe ser mayor que cero.');if(!existing&&account&&account.currency!==currency)return alert('La moneda de la inversión debe coincidir con la moneda de la cuenta vinculada.');if(!existing&&account&&invested>accountBalance(account))return alert('El capital supera el saldo disponible de la cuenta.');i.name=name;i.type=$('iv_type').value;i.institution=$('iv_inst').value.trim();i.accountId=accountId;i.currency=currency;i.invested=invested;i.currentValue=current;i.annualRate=Number($('iv_rate').value)||0;i.rateType=$('iv_rate_type').value;i.termMonths=Number($('iv_months').value)||0;i.startDate=$('iv_start').value;i.maturityDate=$('iv_end').value;i.goalId=$('iv_goal').value;i.note=$('iv_note').value.trim();if(!existing){db.investments.push(i);if(account){db.transactions.push({id:'t'+Date.now(),date:today(),type:'Inversión',amount:invested,currency,description:'Inversión · '+name,account:account.id,investmentId:i.id,affectsBalance:true})}}save();closeModal();render()}
function withdrawInvestment(id){let i=db.investments.find(x=>x.id===id),acc=i&&db.accounts.find(a=>a.id===i.accountId);if(!i)return;if(!acc)return alert('Esta inversión no tiene una cuenta vinculada para recibir el retiro. Edítala primero.');let value=investmentBalance(i);if(!value)return alert('La inversión no tiene valor disponible.');openModal(`<h2>Liquidar ${i.name}</h2><div class="notice">Valor actual registrado: <b>${money(value,i.currency)}</b><br>Resultado acumulado: <b>${money(investmentReturn(i),i.currency)}</b></div><div class="field"><label>Monto a retirar</label><input id="iv_withdraw" type="number" min="0.01" max="${value}" step="0.01" value="${value}"></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn rose" onclick="saveInvestmentWithdrawal('${id}')">Liquidar</button></div>`)}
function saveInvestmentWithdrawal(id){let i=db.investments.find(x=>x.id===id),acc=i&&db.accounts.find(a=>a.id===i.accountId),amount=Number($('iv_withdraw').value)||0,value=i?investmentBalance(i):0;if(!i||!acc||amount<=0||amount>value)return alert('Introduce un monto válido.');db.transactions.push({id:'t'+Date.now(),date:today(),type:'Retiro de inversión',amount,currency:i.currency,description:'Retiro · '+i.name,account:acc.id,investmentId:i.id,affectsBalance:true});if(amount>=value){i.currentValue=0;i.inactive=true}else{i.currentValue=value-amount}save();closeModal();render()}
function savings(){syncSchema();let totalBy={};db.savings.forEach(s=>{let b=savingsBalance(s);if(b>0)totalBy[s.currency]=(totalBy[s.currency]||0)+b});let total=Object.entries(totalBy).reduce((sum,[c,v])=>sum+convert(v,c,db.baseCurrency),0);let invBy={};db.investments.filter(i=>!i.inactive).forEach(i=>{let b=investmentBalance(i);if(b>0)invBy[i.currency]=(invBy[i.currency]||0)+b});let invTotal=Object.entries(invBy).reduce((sum,[c,v])=>sum+convert(v,c,db.baseCurrency),0);let invCost=db.investments.filter(i=>!i.inactive).reduce((sum,i)=>sum+convert(Number(i.invested)||0,i.currency,db.baseCurrency),0);let invGain=invTotal-invCost;let goals=db.savingsGoals||[];let goalCards=goals.map(g=>{let saved=savingsGoalAmount(g),pct=g.target>0?Math.min(100,saved/g.target*100):0;return `<div class="goal-card"><div class="goal-head"><div><div class="goal-title">${g.name}</div><div class="muted">${g.type||'Meta de ahorro'}${g.deadline?' · '+fmtDate(g.deadline):''}</div></div><span class="saving-location">${Math.round(pct)}%</span></div><div class="goal-progress"><i style="width:${pct}%"></i></div><div class="row" style="padding:5px 0 0;border:0"><div><b>${money(saved,g.currency)}</b><div class="muted">ahorrado de ${money(g.target,g.currency)}</div></div><div class="amount">${money(Math.max(0,g.target-saved),g.currency)}</div></div>${g.note?`<div class="muted" style="margin-top:8px">${g.note}</div>`:''}</div>`}).join('');let holdingRows=db.savings.map(s=>`<div class="row"><div><b>${s.name}</b><div class="muted">${s.accountId?(db.accounts.find(a=>a.id===s.accountId)?.name||'Cuenta eliminada'):s.location||'Ubicación no indicada'}${s.goalId?' · '+(db.savingsGoals.find(g=>g.id===s.goalId)?.name||'Meta'):''}</div></div><div class="right"><div class="amount">${money(savingsBalance(s),s.currency)}</div><button class="btn small" onclick="editSavings('${s.id}')">Editar</button> <button class="btn small" onclick="withdrawSavings('${s.id}')">Retirar</button></div></div>`).join('');let byCurrency=Object.entries(totalBy).map(([c,v])=>`<div class="row"><div><b>${c}</b><div class="muted">${currencyName(c)}</div></div><div class="amount">${money(v,c)}</div></div>`).join('')||'<div class="muted">Todavía no tienes ahorros registrados.</div>';let invRows=db.investments.filter(i=>!i.inactive).map(i=>{let st=investmentStatus(i),gain=investmentReturn(i),pct=(Number(i.invested)||0)>0?gain/(Number(i.invested)||1)*100:0;return `<div class="row"><div style="min-width:0"><b>${i.name}</b><div class="muted">${i.type} · ${i.institution||'Entidad no indicada'}${i.maturityDate?' · vence '+fmtDate(i.maturityDate):''}</div></div><div class="right"><div class="amount">${money(investmentBalance(i),i.currency)}</div><div class="muted">${Number(i.annualRate||0).toLocaleString(db.language,{maximumFractionDigits:2})}% ${i.rateType||'Fija'} · ${i.termMonths||0} meses · <span class="badge ${st.cls}">${st.label}</span></div><div style="margin-top:5px"><button class="btn small" onclick="editInvestment('${i.id}')">Editar</button> <button class="btn small" onclick="withdrawInvestment('${i.id}')">Liquidar</button></div></div></div>`}).join('');let portfolio=db.investments.filter(i=>!i.inactive).map(i=>`<tr><td><b>${i.name}</b></td><td>${i.type}</td><td>${i.institution||'—'}</td><td>${money(i.invested,i.currency)}</td><td>${money(investmentBalance(i),i.currency)}</td><td>${Number(i.annualRate||0).toLocaleString(db.language,{maximumFractionDigits:2})}%</td><td>${i.termMonths||0} meses</td><td>${i.maturityDate?fmtDate(i.maturityDate):'—'}</td><td class="amount">${money(investmentReturn(i),i.currency)}</td><td><button class="btn small" onclick="editInvestment('${i.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="10" class="muted">Todavía no tienes inversiones registradas.</td></tr>';let combined=total+invTotal;$('content').innerHTML=`<div class="grid"><div class="card metric savings-accent"><div class="label">Total ahorrado · ${db.baseCurrency}</div><div class="savings-total">${money(total,db.baseCurrency)}</div><div class="sub">Ahorro líquido y fondos separados</div></div><div class="card metric"><div class="label">Total invertido · ${db.baseCurrency}</div><div class="value">${money(invTotal,db.baseCurrency)}</div><div class="sub">Valor actual de la cartera</div></div><div class="card metric"><div class="label">Resultado de inversiones</div><div class="value">${money(invGain,db.baseCurrency)}</div><div class="sub">Ganancia / pérdida registrada</div></div><div class="card metric"><div class="label">Ahorro + inversiones</div><div class="value">${money(combined,db.baseCurrency)}</div><div class="sub">Patrimonio destinado a ahorro</div></div></div><div class="section two"><div class="card"><div class="section-head"><div><h2>Mis ahorros</h2><div class="muted">Dinero reservado y dónde está.</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" onclick="editSavings()">＋ Ahorro</button><button class="btn rose" onclick="editSavingsGoal()">＋ Plan</button></div></div>${holdingRows||'<div class="notice">Añade tu primer ahorro indicando la cuenta donde lo tienes.</div>'}</div><div class="card"><div class="section-head"><h2>Resumen por moneda</h2><span class="pill">${Object.keys(totalBy).length} moneda(s)</span></div>${byCurrency}</div></div><div class="section card"><div class="section-head"><div><h2>Planes y metas</h2><div class="muted">Viajes, vehículo, vivienda, fondo de emergencia o cualquier objetivo.</div></div><button class="btn" onclick="editSavingsGoal()">＋ Nueva meta</button></div><div class="savings-goals">${goalCards||'<div class="notice">Crea una meta y asígnale tus fondos de ahorro.</div>'}</div></div><div class="section card savings-accent"><div class="section-head"><div><h2> Cartera de inversiones</h2><div class="muted">Certificaciones, depósitos, fondos, ETF, acciones, bonos y otras inversiones.</div></div><button class="btn rose" onclick="editInvestment()">＋ Inversión / certificación</button></div><div class="grid" style="margin-bottom:10px"><div class="card metric"><div class="label">Capital invertido</div><div class="value">${money(invCost,db.baseCurrency)}</div></div><div class="card metric"><div class="label">Valor actual</div><div class="value">${money(invTotal,db.baseCurrency)}</div></div><div class="card metric"><div class="label">Rentabilidad acumulada</div><div class="value">${money(invGain,db.baseCurrency)}</div></div><div class="card metric"><div class="label">Posiciones</div><div class="value">${db.investments.filter(i=>!i.inactive).length}</div></div></div>${invRows||'<div class="notice">Registra tu primera certificación o inversión para empezar a construir tu cartera.</div>'}<div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Instrumento</th><th>Tipo</th><th>Entidad</th><th>Capital</th><th>Valor actual</th><th>Tasa anual</th><th>Plazo</th><th>Vencimiento</th><th>Resultado</th><th></th></tr></thead><tbody>${portfolio}</tbody></table></div><div class="notice" style="margin-top:12px">La cartera permite registrar tasas y plazos para seguimiento personal. Los valores y rentabilidades deben actualizarse con la información real de tu entidad financiera.</div></div>`}

function saveSavings(id,existing){let s=existing?db.savings.find(x=>x.id===id):{id,opening:0};let name=$('sv_name').value.trim();let amount=Number($('sv_amount').value)||0;let accountId=$('sv_account').value;let account=db.accounts.find(a=>a.id===accountId);let currency=$('sv_cur').value;if(!name)return alert('Escribe un nombre para el ahorro.');if(amount<0)return alert('El monto no puede ser negativo.');if(!existing&&account&&account.currency!==currency)return alert('La moneda del ahorro debe coincidir con la moneda de la cuenta vinculada.');if(!existing&&account&&amount>accountBalance(account))return alert('El monto supera el saldo disponible de la cuenta.');s.name=name;s.kind=$('sv_kind')?.value||'Ahorro líquido';s.accountId=accountId;s.location=$('sv_location').value.trim();s.currency=currency;s.goalId=$('sv_goal').value;s.note=$('sv_note').value.trim();if(existing){s.opening=Number(s.opening)||0}else{s.opening=account?0:amount;db.savings.push(s);if(amount>0&&account){db.transactions.push({id:'t'+Date.now(),date:today(),type:'Ahorro',amount,currency,description:'Ahorro · '+name,account:account.id,savingsId:s.id,affectsBalance:true});}}save();closeModal();render()}

function editSavingsGoal(id){let g=id?db.savingsGoals.find(x=>x.id===id):{id:'g'+Date.now(),name:'',type:'',target:0,currency:db.baseCurrency,deadline:'',note:''};openModal(`<h2>${id?'Editar':'Nuevo'} plan de ahorro</h2><div class="form"><div class="field"><label>Nombre del plan</label><input id="sg_name" value="${g.name}" placeholder="Ej. Viaje a Italia"></div><div class="field"><label>Tipo de objetivo</label><select id="sg_type">${['Viaje','Vehículo','Vivienda','Fondo de emergencia','Estudios','Compra','Otro'].map(x=>`<option ${g.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Meta total</label><input id="sg_target" type="number" min="0" step="0.01" value="${g.target||0}"></div><div class="field"><label>Moneda</label><select id="sg_cur">${currencyCodes().map(c=>`<option value="${c}" ${g.currency===c?'selected':''}>${c} · ${currencyName(c)}</option>`).join('')}</select></div><div class="field"><label>Fecha objetivo</label><input id="sg_date" type="date" value="${g.deadline||''}"></div><div class="field full"><label>Descripción / estrategia</label><input id="sg_note" value="${g.note||''}" placeholder="Ej. Ahorrar 200 € al mes"></div></div><div class="notice">Después puedes vincular uno o varios fondos de ahorro a esta meta. Finanza calculará automáticamente cuánto llevas y cuánto falta.</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn rose" onclick="saveSavingsGoal('${g.id}',${!!id})">Guardar</button></div>`)}
function saveSavingsGoal(id,existing){let g=existing?db.savingsGoals.find(x=>x.id===id):{id};g.name=$('sg_name').value.trim();g.type=$('sg_type').value;g.target=Number($('sg_target').value)||0;g.currency=$('sg_cur').value;g.deadline=$('sg_date').value;g.note=$('sg_note').value.trim();if(!g.name)return alert('Escribe un nombre para la meta.');if(g.target<=0)return alert('La meta debe ser mayor que cero.');if(!existing)db.savingsGoals.push(g);save();closeModal();render()}
function budget(){let month=today().slice(0,7);if(!Object.keys(db.budgets).length)db.budgets=clone(DEFAULT_BUDGETS);let bcur=db.budgetCurrency||db.baseCurrency,catTotal=Object.values(db.budgets||{}).reduce((a,b)=>a+(Number(b)||0),0),commitments=budgetMonthlyCommitments(bcur,month),commitTotal=commitments.reduce((a,p)=>a+p.converted,0),total=catTotal+commitTotal,spent=budgetMonthlySpent(bcur,month),pct=total?spent/total*100:0;let curOpts=currencyCodes().map(c=>`<option value="${c}" ${c===bcur?'selected':''}>${c} · ${currencyName(c)}</option>`).join('');$('content').innerHTML=`<div class="budget-overview"><div class="budget-stat"><span>Presupuesto total del mes</span><b>${money(total,bcur)}</b><div class="muted">Categorías + cuotas</div></div><div class="budget-stat"><span>Gastado este mes</span><b>${money(spent,bcur)}</b><div class="muted">Gastos + cuotas pagadas</div></div><div class="budget-stat"><span>Ejecución</span><b class="budget-status ${pct>100?'over':'ok'}">${pct.toFixed(0)}%</b><div class="muted">${pct>100?`Exceso ${(pct-100).toFixed(0)}%`:`${Math.max(0,100-pct).toFixed(0)}% disponible`}</div></div><div class="budget-stat"><span>Disponible del presupuesto</span><b class="budget-status ${total-spent<0?'over':'ok'}">${money(Math.max(0,total-spent),bcur)}</b><div class="budget-bar"><i class="${pct>100?'over':''}" style="width:${Math.min(100,pct)}%"></i></div></div></div><div class="card"><div class="section-head"><div><h2>Presupuesto mensual</h2><div class="muted">Compara lo asignado con lo gastado y controla el exceso.</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><select class="btn" id="budget_cur" onchange="setBudgetCurrency(this.value)">${curOpts}</select><button class="btn" onclick="addBudgetCategory()">＋ Categoría</button><button class="btn rose" onclick="editBudget()">Editar</button></div></div>${Object.entries(db.budgets).map(([c,b])=>{let used=db.transactions.filter(t=>(t.type==='Gasto'||t.type==='Pago de deuda')&&t.date?.startsWith(month)&&t.category===c).reduce((sum,t)=>sum+convert(t.amount,t.currency,bcur),0),p=b?used/b*100:0;return `<div class="row"><div style="flex:1"><b>${c}</b><div class="muted">${money(used,bcur)} de ${money(b,bcur)} · ${p.toFixed(0)}%</div><div class="budget-bar"><i class="${p>100?'over':''}" style="width:${Math.min(100,p)}%"></i></div></div><div class="amount ${p>100?'budget-status over':''}">${p>100?`+${money(used-b,bcur)}`:money(Math.max(0,b-used),bcur)}</div></div>`}).join('')||'<div class="success">No tienes categorías de presupuesto.</div>'}</div><div class="section card"><div class="section-head"><div><h2>Cuotas y mensualidades</h2><div class="muted">Las cuotas activas forman parte del presupuesto del mes.</div></div><button class="btn" onclick="go('Pagos')">Gestionar pagos</button></div>${commitments.map(p=>`<div class="budget-commitment"><div class="section-head" style="margin-bottom:4px"><div><b>${p.name}</b><div class="muted">${p.frequency} · ${p.kind} · ${p.dueDate?fmtDate(p.dueDate):'Sin fecha'}</div></div><b>${money(p.converted,bcur)}</b></div></div>`).join('')||'<div class="notice">No tienes cuotas o mensualidades activas.</div>'}<div class="row"><b>Total de cuotas incluidas</b><b>${money(commitTotal,bcur)}</b></div></div>`}

function setBudgetCurrency(c){let old=db.budgetCurrency||db.baseCurrency;if(!db.currencies[c]||c===old)return;if(Object.keys(db.budgets||{}).length)Object.keys(db.budgets).forEach(k=>db.budgets[k]=convert(db.budgets[k],old,c));db.budgetCurrency=c;db.expenseSummaryCurrency=c;save();render()}
const THEME_PRESETS={rose:{name:'Rosa clásico',sw1:'#f3deda',sw2:'#c9857e',vars:{bg:'#f8f2f0',paper:'#fffdfc',ink:'#302b2a',muted:'#8a7e79',line:'#eadeda',rose:'#dba8a1',rose2:'#f1dcd8',blush:'#f8e9e5',taupe:'#b9a69d',gold:'#b99460',green:'#789b83',red:'#bd6d72'}},sage:{name:'Sage',sw1:'#e7eee8',sw2:'#789b83',vars:{bg:'#f3f6f3',paper:'#fffefd',ink:'#29332d',muted:'#78827c',line:'#dce6df',rose:'#91aa9a',rose2:'#dce8df',blush:'#e8f0ea',taupe:'#9aa79e',gold:'#ae9163',green:'#6f907d',red:'#b96d72'}},lavender:{name:'Lavanda',sw1:'#ece8f3',sw2:'#8d7fa8',vars:{bg:'#f6f3f8',paper:'#fffefe',ink:'#302b36',muted:'#827b89',line:'#e4dfea',rose:'#a99bbd',rose2:'#e9e3f0',blush:'#eee9f4',taupe:'#aaa1b1',gold:'#ae9163',green:'#789788',red:'#b96d78'}},sand:{name:'Arena',sw1:'#f3eadc',sw2:'#b99562',vars:{bg:'#f7f3ec',paper:'#fffdfa',ink:'#342f29',muted:'#8b8174',line:'#e8dfd2',rose:'#c7a27b',rose2:'#eee2d2',blush:'#f4eadc',taupe:'#b7a895',gold:'#b18b55',green:'#7f9985',red:'#b96d72'}},midnight:{name:'Midnight',sw1:'#31333c',sw2:'#8f7c96',vars:{bg:'#1f2026',paper:'#292a31',ink:'#f4f0f2',muted:'#b5afb6',line:'#41414b',rose:'#b98f9d',rose2:'#3b3037',blush:'#3a2e35',taupe:'#8d8790',gold:'#c0a06b',green:'#7da18e',red:'#c7787e'}}};function applyTheme(name,saveIt=true){name=THEME_PRESETS[name]?name:'rose';db.theme=name;let v=THEME_PRESETS[name].vars;Object.entries(v).forEach(([k,val])=>document.documentElement.style.setProperty('--'+k,val));if(db.customTheme?.primary){document.documentElement.style.setProperty('--rose',db.customTheme.primary);document.documentElement.style.setProperty('--rose2',db.customTheme.secondary||db.customTheme.primary);document.documentElement.style.setProperty('--blush',db.customTheme.surface||db.customTheme.secondary||db.customTheme.primary)}if(db.design==='compact')document.documentElement.style.setProperty('--shadow','0 7px 20px rgba(91,66,57,.07)');else if(db.design==='minimal')document.documentElement.style.setProperty('--shadow','none');document.querySelector('meta[name="theme-color"]')?.setAttribute('content',db.customTheme?.primary||v.rose);if(saveIt&&user)save()}
function saveCustomTheme(){db.customTheme={primary:$('theme_primary').value,secondary:$('theme_secondary').value,surface:$('theme_surface').value};db.design=$('theme_design').value;applyTheme(db.theme,false);save();render()}
function themePicker(){return Object.entries(THEME_PRESETS).map(([k,t])=>`<button type="button" class="theme-option ${db.theme===k?'active':''}" onclick="applyTheme('${k}',true);render()"><span class="theme-swatch" style="--sw1:${t.sw1};--sw2:${t.sw2}"></span><b>${t.name}</b><small>${k==='midnight'?'Oscuro':'Claro'}</small></button>`).join('')}function settings(){syncSchema();let curOpts=currencyCodes().map(c=>`<option value="${c}" ${db.baseCurrency===c?'selected':''}>${c} · ${currencyName(c)}</option>`).join('');let langs=Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${db.language===k?'selected':''}>${v}</option>`).join('');let curRows=currencyCodes().map(c=>`<tr><td><b>${c}</b></td><td>${currencyName(c)}</td><td>${Number(db.fxRates[c]||1).toLocaleString(db.language,{maximumFractionDigits:6})}</td><td>${c===db.baseCurrency?'<span class="badge good">BASE</span>':''}</td></tr>`).join('');$('content').innerHTML=`<div class="settings-grid"><div class="card"><div class="section-head"><h2>Tema de Finanza</h2><span class="badge info">PERSONALIZABLE</span></div><p class="muted">Elige el color de la aplicación. La preferencia queda vinculada a tu cuenta.</p><div class="theme-palette">${themePicker()}</div><div class="theme-custom-grid"><div class="theme-control"><label>Color principal</label><input id="theme_primary" type="color" value="${db.customTheme?.primary||THEME_PRESETS[db.theme]?.vars?.rose||'#dba8a1'}"></div><div class="theme-control"><label>Color secundario</label><input id="theme_secondary" type="color" value="${db.customTheme?.secondary||THEME_PRESETS[db.theme]?.vars?.rose2||'#f1dcd8'}"></div><div class="theme-control"><label>Fondo/acento</label><input id="theme_surface" type="color" value="${db.customTheme?.surface||THEME_PRESETS[db.theme]?.vars?.blush||'#f8e9e5'}"></div><div class="theme-control"><label>Diseño</label><select id="theme_design"><option value="soft" ${db.design==='soft'?'selected':''}>Suave</option><option value="compact" ${db.design==='compact'?'selected':''}>Compacto</option><option value="minimal" ${db.design==='minimal'?'selected':''}>Minimalista</option></select></div></div><button class="btn rose" style="margin-top:10px" onclick="saveCustomTheme()">Aplicar diseño</button></div><div class="card"><div class="section-head"><h2>Perfil</h2><span class="badge good">ACTIVO</span></div><div class="form"><div class="field"><label>Usuario</label><input id="s_user" value="${db.profile.username}" disabled></div><div class="field"><label>Fecha de nacimiento</label><input value="${db.profile.birthdate||''}" disabled></div><div class="field full"><label>Correo</label><input id="s_email" value="${db.profile.email}"></div></div><button class="btn rose" style="margin-top:12px" onclick="saveProfile()">Guardar perfil</button></div><div class="card"><div class="section-head"><h2>Idioma y moneda principal</h2><span></span></div><div class="form"><div class="field"><label>${languageText('language')}</label><select id="s_lang">${langs}</select></div><div class="field"><label>${languageText('base')}</label><select id="s_base">${curOpts}</select></div><div class="field"><label>Moneda del total disponible</label><select id="s_available">${currencyCodes().map(c=>`<option value="${c}" ${db.availableSummaryCurrency===c?'selected':''}>${c} · ${currencyName(c)}</option>`).join('')}</select></div><div class="field"><label>Moneda del presupuesto</label><select id="s_budget">${currencyCodes().map(c=>`<option value="${c}" ${db.budgetCurrency===c?'selected':''}>${c} · ${currencyName(c)}</option>`).join('')}</select></div><div class="field"><label>Moneda del resumen de gastos</label><select id="s_spend">${currencyCodes().map(c=>`<option value="${c}" ${db.expenseSummaryCurrency===c?'selected':''}>${c} · ${currencyName(c)}</option>`).join('')}</select></div></div><p class="muted">La moneda base se usa para los totales consolidados. La moneda del presupuesto es independiente y puede cambiarse cuando quieras. Cada cuenta, ingreso, gasto y deuda conserva su moneda original.</p><button class="btn rose" onclick="saveLocalization()">Guardar preferencias</button></div><div class="card"><div class="section-head"><h2>Tipos de cambio automáticos</h2><button class="btn rose small" onclick="refreshFxRates(true)">↻ Actualizar ahora</button></div><div class="success">Las tasas se consultan desde la web y se actualizan periódicamente. Última actualización: <b>${db.fxMeta?.date||'pendiente'}</b> · Fuente: ${db.fxMeta?.source||'Frankfurter'}</div><p class="muted" style="margin-top:10px">La app usa EUR como moneda pivote para convertir automáticamente entre monedas. Si una moneda no tiene cobertura del proveedor, puedes conservarla en tus registros y añadir una tasa manual cuando sea necesario.</p><div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Nombre</th><th>1 EUR =</th><th></th></tr></thead><tbody>${curRows}</tbody></table></div></div><div class="card"><div class="section-head"><h2> Añadir moneda</h2><button class="btn small" onclick="loadCurrencyCatalog(true)">Cargar catálogo</button></div><p class="muted">Escribe un código ISO de 3 letras. La app intentará obtener automáticamente su tasa desde el proveedor web.</p><div class="form"><div class="field"><label>Código ISO</label><input id="new_cur_code" placeholder="Ej. NOK"></div><div class="field"><label>Nombre</label><input id="new_cur_name" placeholder="Nombre de la moneda"></div></div><button class="btn" style="margin-top:10px" onclick="addCurrency()">＋ Añadir moneda</button></div><div class="card"><div class="section-head"><h2>Notificaciones</h2><span></span></div><div class="notice">Las alertas aparecen en la bandeja de la app. El botón de correo prepara un mensaje con tus vencimientos.</div><label style="display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800"><input type="checkbox" id="s_not" ${db.profile.notifications?'checked':''}> Activar recordatorios</label><button class="btn" style="margin-top:12px" onclick="saveNotif()">Guardar</button></div><div class="card"><div class="section-head"><h2>Face ID · acceso rápido</h2><span></span></div><p class="muted">Activa un Passkey en este iPhone para entrar con Face ID sin escribir la contraseña.</p><button class="btn rose" onclick="registerLocalPasskey()">Activar Face ID</button><div class="notice" style="margin-top:10px">El sistema biométrico se gestiona por iOS. La app no recibe ni almacena tu rostro.</div></div><div class="card"><div class="section-head"><h2>Seguridad de la cuenta</h2><span class="badge info">CUENTA</span></div><p class="muted">Gestiona tu contraseña sin salir de la aplicación. Tu contraseña se almacena como un hash y nunca se muestra en pantalla.</p><div class="security-actions"><button class="btn rose" onclick="changePassword()">Cambiar contraseña</button><button class="btn" onclick="showRecoveryCode()">Ayuda de recuperación</button></div><div class="auth-note" style="margin-top:10px">Si olvidaste la contraseña, usa “¿Olvidaste tu contraseña?” en la pantalla de inicio y tu código de recuperación.</div></div><div class="card"><div class="section-head"><h2>Exportar / respaldar</h2><span></span></div><p class="muted">Exporta el Excel financiero completo con los datos actuales y las conversiones.</p><button class="btn rose" onclick="exportExcel()"> Exportar Excel completo</button> <button class="btn" onclick="exportJSON()">JSON</button></div><div class="card"><div class="section-head"><h2>Cuenta en la nube</h2><span class="badge info">REPOSITORIO</span></div><p class="muted">Tu usuario y una copia de sus datos se guardan en el repositorio de la aplicación cuando el servidor está disponible. El dispositivo conserva una copia local para trabajar sin conexión.</p></div><div class="card"><div class="section-head"><h2>Sesión</h2><span></span></div><p class="muted">Tu sesión permanece activa aunque recargues la página.</p><button class="btn" onclick="logout()">Cerrar sesión</button></div></div><div class="section card"><div class="section-head"><h2>Correo de vencimientos</h2><button class="btn" onclick="sendReminderEmail()"> Preparar correo</button></div><p class="muted">Se abrirá tu aplicación de correo con los vencimientos actuales.</p></div>`}
function saveLocalization(){db.language=$('s_lang').value;let old=db.budgetCurrency||db.baseCurrency,next=$('s_budget')?.value||old; if(next!==old)Object.keys(db.budgets||{}).forEach(c=>db.budgets[c]=convert(db.budgets[c],old,next));db.baseCurrency=$('s_base').value;db.availableSummaryCurrency=$('s_available')?.value||db.availableSummaryCurrency||db.baseCurrency;db.budgetCurrency=next;db.expenseSummaryCurrency=$('s_spend')?.value||next;save();document.documentElement.lang=db.language;nav();render()}
function saveCurrencies(){save();render()}
async function refreshFxRates(force=false){try{let r=await fetch('/api/rates',{cache:force?'no-store':'default'});if(!r.ok)throw new Error('rates');let data=await r.json();if(data?.rates){db.fxRates={...db.fxRates,...data.rates,EUR:1};db.rates=db.fxRates;db.fxMeta={date:data.date||new Date().toISOString().slice(0,10),source:data.source||'Frankfurter'};save();if(force)render()}}catch(e){if(force)alert('No se pudieron actualizar los tipos de cambio. Se conservarán las últimas tasas disponibles.')}}
async function loadCurrencyCatalog(force=false){try{let r=await fetch('/api/rates?catalog=1',{cache:force?'no-store':'default'});if(!r.ok)throw new Error('catalog');let data=await r.json();if(data?.currencies){for(const [k,v] of Object.entries(data.currencies)){if(!db.currencies[k])db.currencies[k]={name:v.name||k,rate:Number(db.fxRates?.[k]||1),symbol:k}}save();if(force)render()}}catch(e){if(force)alert('No se pudo cargar el catálogo de monedas en este momento.')}}
function addCurrency(){let code=String($('new_cur_code')?.value||'').trim().toUpperCase(),name=String($('new_cur_name')?.value||'').trim()||code;if(!/^[A-Z]{3}$/.test(code))return alert('Usa un código ISO de 3 letras, por ejemplo NOK.');if(db.currencies[code])return alert('Esa moneda ya está registrada.');db.currencies[code]={name,rate:1,symbol:code};db.fxRates[code]=1;save();refreshFxRates(false).finally(()=>render())}

function openModal(html){$('modal').innerHTML=html;$('modalBack').classList.add('show')}function closeModal(){$('modalBack').classList.remove('show')}
function openQuick(type='',prefDebt=''){window.currentPaymentId='';let types=['Gasto','Ingreso','Ahorro','Pago de deuda','Transferencia','Compra con tarjeta'];openModal(`<h2>Agregar movimiento</h2><div class="form"><div class="field"><label>Tipo de operación</label><select id="f_type" onchange="refreshForm('${prefDebt}')">${types.map(x=>`<option ${x===type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input id="f_date" type="date" value="${today()}"></div><div id="qfields" class="field full"></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn rose" onclick="saveQuick()">Guardar movimiento</button></div>`);refreshForm(prefDebt)}

function quickAccountOptions(selected='',includeCards=true){return db.accounts.filter(a=>includeCards||a.type!=='Tarjeta').map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${a.name} · ${a.currency}</option>`).join('')}function syncQuickAccountCurrency(id){let a=db.accounts.find(x=>x.id===id),c=$('f_currency');if(a&&c)c.value=a.currency}function refreshForm(prefDebt=''){let t=$('f_type').value,h='';let defaultAccount=db.accounts.find(a=>a.type!=='Tarjeta')?.id||'';let defaultCur=db.accounts.find(a=>a.id===defaultAccount)?.currency||db.baseCurrency;let curs=currencyCodes().map(x=>`<option value="${x}" ${x===defaultCur?'selected':''}>${x}</option>`).join('');if(t==='Transferencia')h=`<div class="form"><div class="field"><label>Cuenta de origen</label><select id="f_from">${quickAccountOptions(defaultAccount,false)}</select></div><div class="field"><label>Cuenta de destino</label><select id="f_to">${quickAccountOptions('',false)}</select></div><div class="field"><label>Monto</label><input id="f_amount" type="number" min="0.01" step="0.01"></div><div class="field"><label>Moneda</label><select id="f_currency">${curs}</select></div><div class="field full"><label>Concepto</label><input id="f_desc" placeholder="Ej. Traspaso entre cuentas"></div></div>`;else if(t==='Ahorro')h=`<div class="form"><div class="field full"><label>Cuenta de origen</label><select id="f_account" onchange="syncQuickAccountCurrency(this.value)">${quickAccountOptions(defaultAccount,false)}</select></div><div class="field full"><label>Fondo de ahorro de destino</label><select id="f_savings"><option value="">Ahorro general</option>${db.savings.map(x=>`<option value="${x.id}">${x.name} · ${x.currency}${x.accountId?' · '+(db.accounts.find(a=>a.id===x.accountId)?.name||''):''}</option>`).join('')}</select></div><div class="field"><label>Monto</label><input id="f_amount" type="number" min="0.01" step="0.01"></div><div class="field"><label>Moneda</label><select id="f_currency">${curs}</select></     if(own)return own.getAttribute('data-debt-id')||own.getAttribute('data-id');
    return btn.dataset.debtId||null;
  }
  function deleteDebt(id){
    const d=getDB();if(!d||!Array.isArray(d.debts))return;
    const debt=d.debts.find(x=>String(x.id)===String(id));if(!debt)return;
    if(!confirm('¿Eliminar la deuda "'+(debt.name||debt.nombre||'esta deuda')+'"? Esta acción no elimina los movimientos históricos.'))return;
    d.debts=d.debts.filter(x=>String(x.id)!==String(id));
    saveRender();
    setTimeout(enhance,100);
  }
  window.finanzaDeleteDebtV7=deleteDebt;
  function addModalDelete(id){
    const modal=document.querySelector('.modal-back.show .modal,.modal-back.show .modal-content,.modal');
    if(!modal||modal.querySelector('.finanza-modal-delete'))return;
    const foot=modal.querySelector('.modal-foot');if(!foot)return;
    const b=document.createElement('button');b.type='button';b.className='btn finanza-modal-delete';b.textContent='Eliminar deuda';
    b.onclick=()=>{deleteDebt(id);const back=modal.closest('.modal-back');if(back)back.classList.remove('show')};
    foot.insertBefore(b,foot.firstChild);
  }
  function wrapDebtEditor(){
    ['editDebt','openDebtEdit','showEditDebt'].forEach(name=>{
      const fn=window[name];
      if(typeof fn!=='function'||fn.__finanzaV7)return;
      const orig=fn;
      const wrapped=function(id){const r=orig.apply(this,arguments);setTimeout(()=>addModalDelete(id),50);return r};
      wrapped.__finanzaV7=true;wrapped.__finanzaV7Original=orig;window[name]=wrapped;
    });
  }
  function wrapRender(){
    const fn=window.render;
    if(typeof fn!=='function'||fn.__finanzaV7)return;
    const orig=fn;
    const wrapped=function(){const r=orig.apply(this,arguments);setTimeout(enhance,80);return r};
    wrapped.__finanzaV7=true;wrapped.__finanzaV7Original=orig;window.render=wrapped;
  }
  function nav(){
    document.querySelectorAll('.nav button').forEach(b=>{
      const t=(b.innerText||'').replace(/\s+/g,' ').trim().toLowerCase();
      if(t.includes('deudas')&&t.includes('presupuesto')){b.classList.add('finanza-debt-nav');b.innerHTML='<i>💳</i><span>Deudas</span>'}
      else if(t==='deudas'||t.startsWith('deudas ')){b.classList.add('finanza-debt-nav');const span=b.querySelector('span');if(span)span.textContent='Deudas'}
      if(t.includes('presupuesto')&&!t.includes('deudas')){const span=b.querySelector('span');if(span)span.textContent='Presupuesto'}
    });
  }
  function uniqueUser(){
    const top=document.querySelector('.top .hello');
    const sideUser=document.querySelector('#finanzaSideUser,.side .finanza-side-user');
    if(top&&sideUser)top.classList.add('finanza-hide-duplicate-user');
    const candidates=[...document.querySelectorAll('.side > *')].filter(el=>el!==sideUser && /mi\s+espacio/i.test((el.innerText||el.textContent||'').trim()));
    candidates.forEach(el=>el.classList.add('finanza-duplicate-side-user'));
  }
  function cleanTop(){
    const top=document.querySelector('.top');if(!top)return;
    top.querySelectorAll('*').forEach(el=>{
      const t=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(!t)return;
      if(/^(lunes|martes|miércoles|jueves|viernes|sábado|domingo),?\s+\d{1,2}\s+de\s+[a-záéíóú]+\s+de\s+\d{4}$/i.test(t))el.classList.add('finanza-top-date-hidden');
      if(/pequeñas\s+decisiones,?\s*grandes\s+resultados\.?/i.test(t) && el.children.length<=1)el.classList.add('finanza-top-motto-hidden');
    });
  }
  function debtRows(){
    const root=document.getElementById('content')||document.body;
    root.querySelectorAll('button').forEach(btn=>{
      if((btn.innerText||'').trim().toLowerCase()!=='editar')return;
      const id=debtIdFromButton(btn);if(!id)return;
      if(btn.dataset.finanzaV7Edit)return;
      btn.dataset.finanzaV7Edit='1';
      btn.addEventListener('click',()=>setTimeout(()=>addModalDelete(id),60));
      const parent=btn.closest('.row,.card,tr,li')||btn.parentElement;if(!parent)return;
      if(parent.querySelector('.finanza-delete-debt'))return;
      const del=document.createElement('button');del.type='button';del.className='finanza-delete-debt';del.textContent='Eliminar';del.onclick=()=>deleteDebt(id);
      (btn.parentElement||parent).appendChild(del);
    });
  }
  function enhance(){nav();uniqueUser();cleanTop();wrapRender();wrapDebtEditor();debtRows()}
  setTimeout(enhance,450);setTimeout(enhance,1200);setTimeout(enhance,2200);
})();
</script>

<script id="finanza-v8-js">(function(){function fix(){try{const bar=document.getElementById('primaryBottom');if(bar){const debt=bar.querySelector('button[data-page="Deudas"]');const budget=bar.querySelector('button[data-page="Presupuesto"]');if(debt){debt.dataset.page='Deudas';debt.innerHTML='<i></i><span>Deudas</span>';debt.onclick=function(){go('Deudas')}}if(budget){budget.dataset.page='Presupuesto';budget.innerHTML='<i></i><span>Presupuesto</span>';budget.onclick=function(){go('Presupuesto')};budget.setAttribute('aria-label','Presupuesto')}if(typeof nav==='function')nav()}}catch(e){console.warn('Finanza V8',e)}}const oldGo=window.go;if(typeof oldGo==='function'&&!oldGo.__finanzaV8){const g=oldGo;window.go=function(p,push){const r=g.apply(this,arguments);setTimeout(fix,500);return r};window.go.__finanzaV8=true}setTimeout(fix,300);setTimeout(fix,900);setTimeout(fix,1600)})();</script>
