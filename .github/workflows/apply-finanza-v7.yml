name: Apply Finanza V7
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply V7 patch
        run: python .github/scripts/apply_finanza_v7.py
      - name: Validate HTML and JavaScript
        run: |
          test -s index.html
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          for i,code in enumerate(scripts):
              Path(f'/tmp/finanza-script-{i}.js').write_text(code,encoding='utf-8')
          print(f'Extracted {len(scripts)} scripts')
          PY
          for f in /tmp/finanza-script-*.js; do node --check "$f"; done
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes to commit'; else git commit -m 'Aplicar V7 manualmente'; git push; fi
