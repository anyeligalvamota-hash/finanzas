name: Apply Finanza V5.1 navigation fix
on:
  push:
    paths:
      - '.github/scripts/apply_finanza_v5_1.py'
      - '.github/workflows/apply-finanza-v5-1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/apply_finanza_v5_1.py
      - name: Validate
        run: |
          test -s index.html
          test "$(grep -o 'id=\"finanza-v5-1-css\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"finanza-v5-1-js\"' index.html | wc -l)" -eq 1
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Corregir navegación móvil y acciones superiores'
          git push
