name: Inspect Source Temp
on:
  push:
    paths:
      - '.github/workflows/inspect-source-temp.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy source
        run: cp index.html TEMP_SOURCE_COPY.txt
      - name: Commit source copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TEMP_SOURCE_COPY.txt
          git commit -m 'Temp source inspection copy'
          git push
