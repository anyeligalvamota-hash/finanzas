name: Apply Finanza updates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_finanza_updates.py'
      - '.github/workflows/apply-finanza-updates.yml'
      - 'FINANZA_UPDATE_TRIGGER.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI updates
        run: python .github/scripts/apply_finanza_updates.py
      - name: Validate JavaScript and requested features
        run: |
          test -s index.html
          test "$(grep -o 'id=\"finanza-requested-fixes\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"finanza-v2-css\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"finanza-v2-js\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'function renderBudgetVsSpentChart' index.html | wc -l)" -ge 1
          test "$(grep -o 'function renderDebtChart' index.html | wc -l)" -ge 1
          grep -q 'Responsabilidades de pago' index.html
          grep -q 'finanzaDeletePaymentV2' index.html
          grep -q 'Más de 8 horas sin movimientos' index.html
          grep -q '1 día sin movimientos' index.html
          grep -q 'Fecha de pago' index.html
          grep -q 'nav-mobile-label' index.html
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/finanza-app.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('scripts extracted:',len(scripts))
          PY
          node --check /tmp/finanza-app.js
      - name: Commit updated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Mejorar presupuesto, pagos, gráficos y notificaciones'
          git push
