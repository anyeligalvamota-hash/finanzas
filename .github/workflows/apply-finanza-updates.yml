name: Apply Finanza updates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_finanza_updates.py'
      - '.github/workflows/apply-finanza-updates.yml'
      - 'FINANZA_UPDATE_TRIGGER.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI updates
        run: |
          python .github/scripts/apply_finanza_updates.py
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<script id="finanza-requested-js">','')
          s=s.replace('</script>\n</script></body></html>','</script></body></html>',1)
          marker='/* Histórico de presupuesto: se conserva un snapshot mensual. Los meses sin snapshot muestran 0 asignado. */'
          pos=[i for i in range(len(s)) if s.startswith(marker,i)]
          if len(pos)>1:
              s=s[:pos[1]]+'</script></body></html>'
          if 'function budgetMoney(' not in s:
              anchor='function finanzaMonthKey(offset)'
              s=s.replace(anchor,"function budgetMoney(n,c){return money(n,c)}\\n"+anchor,1)
          p.write_text(s,encoding='utf-8')
          print('historical blocks:',s.count(marker))
          print('budgetMoney:',s.count('function budgetMoney('))
          PY
          sed -i "s/if(user\\&\\&db\\&\\&loginMode!=='new')/if(user\\&\\&db)/" index.html
      - name: Commit updated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Estabilizar presupuesto y evitar pantalla en blanco'
          git push
      - name: Validate
        run: |
          test -s index.html
          test "$(grep -o 'id=\"finanza-requested-fixes\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'function renderBudgetVsSpentChart' index.html | wc -l)" -ge 1
          test "$(grep -o 'function renderDebtChart' index.html | wc -l)" -ge 1
          test "$(grep -o 'function budgetMoney' index.html | wc -l)" -eq 1
          test "$(grep -o 'const __finanzaLoginScreen=loginScreen' index.html | wc -l)" -eq 1
          grep -q 'Moneda de preferencia' index.html
          grep -q 'Cuotas y responsabilidades se gestionan desde Pagos' index.html
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/finanza-app.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('scripts extracted:',len(scripts))
          PY
          node --check /tmp/finanza-app.js
