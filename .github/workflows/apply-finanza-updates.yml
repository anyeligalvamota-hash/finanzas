name: Apply Finanza updates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_finanza_updates.py'
      - '.github/workflows/apply-finanza-updates.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI updates
        run: |
          python .github/scripts/apply_finanza_updates.py
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<script id="finanza-requested-js">','')
          s=s.replace('</script>\n</script></body></html>','</script></body></html>',1)
          p.write_text(s,encoding='utf-8')
          PY
          sed -i "s/if(user\\&\\&db\\&\\&loginMode!=='new')/if(user\\&\\&db)/" index.html
      - name: Commit updated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Mejoras de presupuesto, gráficos y moneda de registro'
          git push
      - name: Validate
        run: |
          test -s index.html
          test "$(grep -o 'id=\"finanza-requested-fixes\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'function renderBudgetVsSpentChart' index.html | wc -l)" -ge 1
          test "$(grep -o 'function renderDebtChart' index.html | wc -l)" -ge 1
          grep -q 'Moneda de preferencia' index.html
          grep -q 'Cuotas y responsabilidades se gestionan desde Pagos' index.html
