name: Apply Finanza V5.2 performance fix
on:
  push:
    paths:
      - '.github/scripts/apply_finanza_v5_2.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V5.2
        run: python .github/scripts/apply_finanza_v5_2.py
      - name: Validate JavaScript
        run: |
          test -s index.html
          test "$(grep -o 'id=\"finanza-v5-2-js\"' index.html | wc -l)" -eq 1
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/finanza.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/finanza.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Corregir lentitud y observer infinito'
          git push
